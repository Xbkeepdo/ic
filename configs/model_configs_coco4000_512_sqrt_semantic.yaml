extends: model_configs_coco4000_512_weighted_cost.yaml

# Extract the absolute target-token vocabulary-softmax probability matrix.
# Existing MAD-based runs stay unchanged and serve as the comparison baseline.
feature_extraction:
  dgst_t:
    four_gate_methods:
      - hpre_softmax_prob_direct
    source_distribution_mode: softmax
    cost_mode: linear_matched_state_target_w02
    cost_modes:
      - linear_matched_state_target_w02
