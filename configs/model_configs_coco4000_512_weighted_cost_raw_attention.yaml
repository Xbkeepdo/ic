extends: model_configs_coco4000_512_weighted_cost_all.yaml

# Raw post-softmax visual attention is the target OT marginal T.  The three
# source marginals and four weighted costs remain identical to WCOST-ALL.
feature_extraction:
  dgst_t:
    four_gate_methods: [raw_attention]

training:
  feature_sets:
    method:
      - raw_attention_risk_linear_matched_state_target_w02
      - raw_attention_risk_linear_matched_state_target_w04
      - raw_attention_risk_linear_matched_state_target_w06
      - raw_attention_risk_linear_matched_state_target_w08
